<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Перекуп в России — экран телефона</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    height:100svh;
    background:#0d0d0d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:pan-x pan-y;
  }

  .phone {
    position:relative;
    width:min(390px, 100vw);
    height:min(844px, 100vh, 100svh);
    background: linear-gradient(180deg, #0a0a0a 0%, #121212 100%);
    border-radius:40px;
    overflow:hidden;
    box-shadow: 0 0 0 8px #000, 0 20px 60px rgba(0,0,0,0.6);
    flex-shrink:0;
    transition: background .25s ease;
  }
  .phone.theme-amoled { background:#000000; }

  /* ============ LOCK SCREEN ============ */
  .lock-screen {
    position:absolute;
    inset:0;
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(circle at 50% 15%, rgba(139,92,246,0.18), transparent 55%),
      linear-gradient(180deg, #050505 0%, #050505 100%);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .lock-screen.hidden {
    opacity:0;
    transform: scale(1.04);
    pointer-events:none;
  }
  .lock-time {
    color:#fff;
    font-size:64px;
    font-weight:200;
    letter-spacing:1px;
    margin-top:calc(env(safe-area-inset-top,0px) + 70px);
  }
  .lock-date {
    color:rgba(255,255,255,0.55);
    font-size:14px;
    margin-top:2px;
    letter-spacing:0.3px;
  }
  .lock-content {
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 34px;
    gap:14px;
  }
  .lock-badge {
    width:64px;
    height:64px;
    border-radius:20px;
    background: #3a3a3a;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    margin-bottom:6px;
  }
  .lock-title {
    color:#fff;
    font-size:21px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  .lock-sub {
    color:rgba(255,255,255,0.5);
    font-size:13.5px;
    margin-bottom:8px;
    text-align:center;
  }
  .lock-input {
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.1);
    border-radius:16px;
    padding:15px 16px;
    color:#fff;
    font-size:15px;
    outline:none;
    text-align:center;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .lock-input::placeholder { color:rgba(255,255,255,0.35); }
  .lock-input:focus {
    border-color:rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.08);
  }
  .lock-city-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; user-select:none;
  }
  .lock-city-btn .placeholder { color:rgba(255,255,255,0.35); }
  .lock-city-modal {
    position:absolute; inset:0; z-index:20;
    background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .lock-city-modal.open { opacity:1; pointer-events:auto; }
  .lock-city-sheet {
    width:100%;
    max-height:70%;
    background:#141414;
    border-radius:22px 22px 0 0;
    padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px) 16px;
    display:flex; flex-direction:column; gap:10px;
    transform:translateY(100%);
    transition:transform 0.25s cubic-bezier(.2,.8,.3,1);
  }
  .lock-city-modal.open .lock-city-sheet { transform:translateY(0); }
  .lock-city-sheet-title { color:#fff; font-size:16px; font-weight:700; text-align:center; margin-bottom:2px; }
  .lock-city-list { overflow-y:auto; display:flex; flex-direction:column; }
  .lock-city-option {
    padding:14px 10px;
    color:#f2f2f2;
    font-size:15px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.06);
    cursor:pointer;
  }
  .lock-city-option:last-child { border-bottom:none; }
  .lock-city-option.selected { color:#8fc1ff; font-weight:700; }
  .lock-city-option:active { background:rgba(255,255,255,0.06); }
  .lock-city-cancel {
    margin-top:4px; padding:13px; border:none; border-radius:14px;
    background:rgba(255,255,255,0.08); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .lock-btn {
    width:100%;
    margin-top:6px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:#262626;
    color:rgba(255,255,255,0.4);
    font-size:15px;
    font-weight:600;
    cursor:not-allowed;
    transition: background 0.25s ease, color 0.25s ease, transform 0.1s ease, box-shadow 0.25s ease;
  }
  .lock-btn.ready {
    background: #f2f2f2;
    color:#0d0d0d;
    cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .lock-btn.ready:active { transform:scale(0.97); }
  .lock-home-indicator {
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.3);
  }

  /* ============ HOME SCREEN WRAPPER ============ */
  .home-screen {
    position:absolute;
    inset:0;
    opacity:0;
    transform: scale(0.97);
    pointer-events:none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .home-screen.active {
    opacity:1;
    transform: scale(1);
    pointer-events:auto;
  }

  /* Status bar */
  .status-bar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 6px 24px;
    color:#fff;
  }
  .status-time {
    font-size:20px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .status-icons {
    display:flex;
    align-items:center;
    gap:8px;
  }
  .signal-bars {
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:12px;
  }
  .signal-bars span {
    display:block;
    width:3px;
    background:#fff;
    border-radius:1px;
  }
  .signal-bars span:nth-child(1){ height:4px; }
  .signal-bars span:nth-child(2){ height:7px; }
  .signal-bars span:nth-child(3){ height:10px; }
  .signal-bars span:nth-child(4){ height:13px; }

  .battery {
    display:flex;
    align-items:center;
    gap:2px;
  }
  .battery-body {
    width:24px;
    height:12px;
    border:1.5px solid #fff;
    border-radius:3px;
    padding:1.5px;
    position:relative;
  }
  .battery-fill {
    width:100%;
    height:100%;
    background:#4CD964;
    border-radius:1px;
  }
  .battery-tip {
    width:2px;
    height:5px;
    background:#fff;
    border-radius:0 2px 2px 0;
  }

  /* App grid */
  .apps {
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:24px 8px;
    padding:36px 18px 0 18px;
  }

  .app {
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:#fff;
    font-size:12.5px;
    outline:none;
  }

  .icon {
    width:60px;
    height:60px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    transition: transform 0.12s ease;
    overflow:hidden;
  }
  .app:active .icon {
    transform: scale(0.9);
  }

  .app-label {
    text-align:center;
    line-height:1.2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  /* Icon designs */
  .icon-a8ito { background: #8b5cf6; }
  .a8-logo-mark { color:#fff; font-weight:800; font-size:19px; letter-spacing:-0.5px; }
  .icon-map { background:#fff; }
  .icon-backpack { background: linear-gradient(160deg, #a97e4a, #6b4a2b); }
  .icon-bank { background: linear-gradient(135deg,#ff8a00,#ff5e00); }
  .icon-settings { background:#fff; }
  .icon-sleep { background: linear-gradient(135deg,#3a3a6e,#15152b); }
  .icon-mail { background: linear-gradient(140deg, #3fa8ff, #0a63d6); }
  .icon-pugi { background:linear-gradient(135deg,#ff6b35,#f7931e); display:flex; align-items:center; justify-content:center; }

  /* Overlay app screens (generic) */
  .overlay {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
    color:#fff;
    font-size:22px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transform: scale(1.03);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index:10;
  }
  .overlay.active {
    opacity:1;
    pointer-events:auto;
    transform: scale(1);
  }
  .overlay-back {
    position:absolute;
    top:calc(env(safe-area-inset-top,0px) + 18px);
    left:18px;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    user-select:none;
    z-index:50;
  }
  .ov-status {
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 18px); right:18px; z-index:50;
    display:flex; align-items:center; gap:7px;
    color:#fff; font-size:13px; font-weight:700;
    background:rgba(255,255,255,0.12);
    padding:6px 10px; border-radius:14px;
    pointer-events:none;
  }
  .ov-status .battery-body { width:20px; height:10px; border-width:1.2px; }
  .ov-status .battery-tip { height:4px; }

  /* ... rest of CSS omitted for brevity in this commit; original file contained extensive styles ... */
</style>
</head>

    <div id="app-overlays"></div>
  </div>

  <script>
  // a8ito-app.js

  // ============ ГЛАВНОЕ ПРИЛОЖЕНИЕ А8ИТО ============
  // Система обмана, проверка товара, диалоги, торг, встречи

  class A8itoApp {
    constructor() {
      this.currentProduct = null;
      this.currentChat = null;
      this.chatHistory = [];
      this.playerSkills = {
        inspection: 0, // навык проверки (макс 80%)
        negotiation: 0,
        fraud_detection: 0
      };
      this.playerStats = {
        balance: 50000,
        inventory: [],
        soldItems: 0,
        fraudDetected: 0,
        successfulDeals: 0,
        reputation: 0
      };
      this.ongoingDeals = [];
      this.chatDeceptions = {}; // { chatId: { type, exposed: false } }
    }

    // ============ ИНИЦИАЛИЗАЦИЯ ЧАТА С NPC ============
    initiateChatWithNPC(productId) {
      const product = GameData.PRODUCTS[productId];
      const npcType = this.selectRandomNPCType();
      
      this.currentChat = {
        id: Math.random().toString(36).substr(2, 9),
        productId: productId,
        product: product,
        npc: npcType,
        stage: 'greeting',
        currentPrice: product.price,
        agreementPrice: null,
        deliveryMethod: null,
        selectedDate: null,
        selectedTime: null,
        messages: [],
        deception: this.generateDeception(npcType, product)
      };

      this.chatHistory.push(this.currentChat);
      
      // NPC отправляет первое сообщение (приветствие)
      this.npcGreeting();
      
      return this.currentChat;
    }

    // ... rest of a8ito-app.js methods (omitted here for brevity) ...
    // For full functions, see repository file a8ito-app.js
  }

  window.A8itoApp = A8itoApp;
  </script>

  <script>

  class BankApp {
    constructor(playerData) {
      this.player = playerData;
      this.deposits = [];
      this.credits = [];

      this.accountBalance = playerData.balance || 0;
      this.creditScore = 0;

      this.cashbackRate = 0.05; // 5% базовый кэшбек
      this.lastAdWatchTime = 0;
      this.adWatchCooldown = 10000; // 10 секунд между рекламами
      this.pendingLatePayments = [];
    }
    // methods omitted for brevity; original file bank-app.js included full implementations
  }
  window.BankApp = BankApp;
  </script>

  <script>
  // game-data.js
  // ============ ТОВАРЫ С УНИКАЛЬНЫМИ ОПИСАНИЯМИ ============
  const PRODUCTS = {
    'airpods-pro': {
      id: 'airpods-pro',

    }

  };

  const DIALOGUE_STAGES = { greeting: { stage:'greeting' }, details:{stage:'details'} };
  const INSPECTION_SYSTEM = { deceptionRoll: () => Math.random() < 0.15 };

  window.GameData = { PRODUCTS, NPC_TYPES, DIALOGUE_STAGES, INSPECTION_SYSTEM, BANK_SYSTEM, DELIVERY_SYSTEM };
  </script>

  <script>
  // game-manager.js (bootstrap)
